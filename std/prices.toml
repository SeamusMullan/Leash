# USD per million tokens ($/MTok).
# source: Anthropic API pricing reference,
# https://docs.anthropic.com/en/docs/about-claude/pricing, verified 2026-09-12.
# Cache read defaults to 0.1x input and cache write to 1.25x input unless a
# model overrides them. `leash.toml` may override individual fields; the
# runtime warns and counts tokens only for a model that is absent here.

verified_on = "2026-09-12"

[models."claude-opus-5"]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write = 6.25

